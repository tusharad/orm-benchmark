# Connection settings
jakarta.persistence.jdbc.driver=org.postgresql.Driver
jakarta.persistence.jdbc.url=jdbc:postgresql://postgres-air:5432/postgres_air?currentSchema=postgres_air,public
jakarta.persistence.jdbc.user=postgres
jakarta.persistence.jdbc.password=postgres

# Dialect & Default Schema
hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
hibernate.default_schema=postgres_air

# Connection Pool (HikariCP)
hibernate.connection.provider_class=org.hibernate.hikaricp.internal.HikariCPConnectionProvider
hibernate.hikari.maximumPoolSize=20
hibernate.hikari.minimumIdle=20
hibernate.hikari.idleTimeout=30000
hibernate.hikari.connectionTimeout=10000

# Performance & Logging
hibernate.show_sql=false
hibernate.format_sql=false
hibernate.jdbc.batch_size=100
hibernate.order_inserts=true
hibernate.order_updates=true
hibernate.generate_statistics=false
